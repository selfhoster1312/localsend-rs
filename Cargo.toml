[package]
name = "localsend"
version = "0.1.0"
edition = "2021"

[lib]
name = "localsend"
path = "src/lib.rs"

[[bin]]
name = "localsend"
path = "src/main.rs"

[dependencies]
argh = "0.1"
axum = { version = "0.8", features = [ "macros", "tracing" ] }
axum-server = { version = "0.7", features = [ "rustls", "tls-rustls" ] }
aws-lc-rs = "1.9"
dirs = "5.0.1"
getrandom = "0.2.15"
log = "0.4"
rand = "0.8"
rcgen = { version = "0.13.1", features = [ "pem", "aws_lc_rs" ] }
reqwest = { version = "0.12.5", default-features = false, features = ["json"] }
rustls = "0.23.13"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
tokio = { version = "1.38.0", features = ["rt-multi-thread", "fs"] }
tracing-subscriber = { version = "0.3.1", features = [ "env-filter" ] }
axum-client-ip = "0.7.0"
pem = "*"
